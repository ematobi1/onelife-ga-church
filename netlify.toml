[build]
publish = "."

[functions]
directory = "services/push/functions"
node_bundler = "esbuild"

[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"

[[redirects]]
from = "/services/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/scripts/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/tests/*"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/package.json"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/package-lock.json"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/netlify.toml"
to = "/404"
status = 404
force = true

[[redirects]]
from = "/README.md"
to = "/404"
status = 404
force = true
